name: artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  devcard:
    runs-on: ubuntu-latest
    steps:
      - name: devcard
        uses: dailydotdev/action-devcard@2.2.0
        with:
          devcard_id: ${{ secrets.DEVCARD_ID }}
          commit_branch: devcard
          commit_message: "chore: update ${filename}"
  devcard-v3:
    runs-on: ubuntu-latest
    steps:
      - name: devcard-v3
        uses: dailydotdev/action-devcard@3.2.1
        with:
          user_id: ${{ secrets.USER_ID }}
          commit_branch: devcard
          commit_filename: devcardv3.png
          commit_message: 'chore: update ${filename}'
